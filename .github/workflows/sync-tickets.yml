name: Bob-OS Ticket Synchronization (GitOps)

on:
  push:
    branches:
      - master
    paths:
      - '.tickets/**'
      - 'docs/EPIC_CONSOLIDATION_BACKLOG.md'

jobs:
  sync_tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/node-versions@v4
        with:
          node-version: 20

      - name: Run Ticket Synchronization Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/sync_github.js

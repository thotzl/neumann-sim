name: Bob-OS Continuous Integration (CI Tests)

on:
  push:
    branches:
      - '**' # Läuft auf jedem Push auf jedem Branch
  pull_request:
    branches:
      - master
      - main # Läuft auf jedem Pull-Request gegen master/main

jobs:
  run_tests:
    # Pinned: ubuntu-24.04 ships glibc 2.39; sqlite3@6 prebuilds need glibc >= 2.38 (ADR 0001).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install -r requirements.txt

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Run Central Test Hub (CI)
        run: |
          node tests/test_all.js

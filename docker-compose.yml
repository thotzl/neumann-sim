version: '3.8'

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

    # 1. Hardware-Schnittstellen (dri & kfd) durchreichen
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"

    # 2. Systemrechte & Shared-Memory mappen (Unerlässlich für HIP/ROCm Performance)
    # Nutzt die exakten numerischen GIDs deines Host-Systems (video: 44, render: 992)
    group_add:
      - "44"
      - "992"
    cap_add:
      - SYS_PTRACE              # Erlaubt dem ROCm-Profiler direkten Speicherzugriff
    security_opt:
      - seccomp=unconfined      # Verhindert, dass Docker HIP/ROCm Systemaufrufe blockiert
    ipc: host                   # Teilt den Shared-Memory-Bereich mit dem Host für maximales Tempo

    # 3. Ryzen AI / Radeon "Secret Sauce" & Extreme Optimierungen
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.5.0 # WICHTIG: Behandelt Radeon 840M (gfx1152) als kompatible gfx1150 RDNA 3.5 GPU
      - OLLAMA_IGPU_ENABLE=1            # Aktiviert die Hardware-Beschleunigung für integrierte AMD-Grafikkarten
      - HSA_ENABLE_SDMA=0               # WICHTIG: Schaltet SDMA ab. Löst alle iGPU-Hänger und Abstürze unter Linux!
      - OLLAMA_FLASH_ATTENTION=1        # Halbiert VRAM-Bedarf bei langen Kontexten (Sonden-Runden)
      - OLLAMA_NUM_PARALLEL=1           # Fokussiert 100% der iGPU-Leistung auf die aktive Sonde

volumes:
  ollama_data:
    name: ollama
